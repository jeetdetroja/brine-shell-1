<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Admin — Brine & Shell</title>
  <meta name="robots" content="noindex, nofollow" />
  <link rel="icon" type="image/png" href="images/brineandshell.png" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root { --navy:#1C1B3A; --gold:#C9A45A; --cream:#FAF0E2; --white:#fff; --muted:#6b6b6b; --text:#2a2a2a; }
    * { box-sizing: border-box; }
    body { margin:0; font-family:'Inter',sans-serif; background:var(--cream); color:var(--text); }
    .wrap { max-width: 1000px; margin: 0 auto; padding: 40px 20px 80px; }
    h1 { color: var(--navy); font-size: 26px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 14px; margin-bottom: 32px; }
    .card { background: var(--white); border-radius: 14px; padding: 32px; box-shadow: 0 4px 24px rgba(28,27,58,.1); }
    .login-card { max-width: 360px; margin: 80px auto; text-align: center; }
    .login-card h1 { margin-bottom: 20px; }
    input[type=password] { width: 100%; padding: 12px 16px; border: 1.5px solid #ddd; border-radius: 8px; font-size: 15px; margin-bottom: 14px; }
    button { cursor: pointer; font-family: inherit; }
    .btn-primary { width: 100%; padding: 13px; background: var(--navy); color: #fff; border: none; border-radius: 50px; font-size: 15px; font-weight: 600; }
    .btn-primary:hover { background: #2e2d54; }
    .error { color: #842029; font-size: 13px; margin-top: 6px; display: none; }
    .topbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px; }
    .logout-btn { background: none; border: 1.5px solid var(--navy); color: var(--navy); padding: 8px 18px; border-radius: 50px; font-size: 13px; font-weight: 600; }
    .logout-btn:hover { background: var(--navy); color: #fff; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th { text-align: left; padding: 10px 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; font-size: 11px; letter-spacing: .4px; }
    td { padding: 12px; vertical-align: top; }
    td.mono { font-family: monospace; font-size: 12px; }
    select { padding: 6px 10px; border-radius: 6px; border: 1.5px solid #ddd; font-size: 13px; font-family: inherit; background: var(--white); }
    .status-saved { color: #1e7e34; font-size: 11px; margin-left: 8px; display: none; }
    .empty { text-align: center; color: var(--muted); padding: 40px 0; }
    .stats-row { display: flex; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
    .stat-tile { flex: 1; min-width: 130px; background: var(--white); border-radius: 12px; padding: 16px 20px; box-shadow: 0 4px 24px rgba(28,27,58,.08); }
    .stat-tile .num { font-size: 24px; font-weight: 700; color: var(--navy); line-height: 1.2; }
    .stat-tile .label { font-size: 12px; color: var(--muted); margin-top: 2px; }
  </style>
</head>
<body>

<div id="loginView" class="wrap" style="display:none;">
  <div class="card login-card">
    <h1>Order Admin</h1>
    <input type="password" id="adminPassword" placeholder="Admin password" autocomplete="current-password" />
    <button class="btn-primary" onclick="adminLogin()">Sign In</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div id="dashView" class="wrap" style="display:none;">
  <div class="topbar">
    <div>
      <h1>Orders</h1>
      <p class="sub">Update fulfillment status — the customer gets an email when it changes.</p>
    </div>
    <button class="logout-btn" onclick="adminLogout()">Sign Out</button>
  </div>
  <div class="stats-row" id="statsRow"></div>

  <div class="card">
    <table id="ordersTable">
      <thead>
        <tr><th>Order</th><th>Date</th><th>Customer</th><th>Items</th><th>Total</th><th>Status</th></tr>
      </thead>
      <tbody id="ordersBody"></tbody>
    </table>
    <div class="empty" id="ordersEmpty" style="display:none;">No paid orders yet.</div>
  </div>
</div>

<script src="js/config.js"></script>
<script>
let STAGES = ['Order Placed', 'Dispatched', 'Shipped', 'Delivered'];

async function checkAdminSession() {
  const res = await fetch(`${API_BASE}/api/admin/orders`, { credentials: 'include' });
  if (res.ok) {
    showDashboard();
    await loadOrders();
  } else {
    document.getElementById('loginView').style.display = 'block';
  }
}

async function adminLogin() {
  const password = document.getElementById('adminPassword').value;
  const err = document.getElementById('loginError');
  err.style.display = 'none';
  try {
    const res = await fetch(`${API_BASE}/api/admin/login`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Sign-in failed.');
    document.getElementById('loginView').style.display = 'none';
    showDashboard();
    await loadOrders();
  } catch (e) {
    err.textContent = e.message;
    err.style.display = 'block';
  }
}

async function adminLogout() {
  await fetch(`${API_BASE}/api/admin/logout`, { method: 'POST', credentials: 'include' });
  document.getElementById('dashView').style.display = 'none';
  document.getElementById('loginView').style.display = 'block';
}

function showDashboard() {
  document.getElementById('loginView').style.display = 'none';
  document.getElementById('dashView').style.display = 'block';
}

async function loadOrders() {
  const body = document.getElementById('ordersBody');
  const empty = document.getElementById('ordersEmpty');
  let res, data;
  try {
    res = await fetch(`${API_BASE}/api/admin/orders`, { credentials: 'include' });
    data = await res.json();
  } catch (err) {
    body.innerHTML = '';
    empty.textContent = 'Could not reach the server. Is it running?';
    empty.style.display = 'block';
    renderStats([]);
    return;
  }
  if (!res.ok || !data.ok) {
    body.innerHTML = '';
    empty.textContent = data?.error || 'Could not load orders — check the Google Sheets setup in .env.';
    empty.style.display = 'block';
    renderStats([]);
    return;
  }
  STAGES = data.stages || STAGES;

  if (!data.orders.length) {
    body.innerHTML = '';
    empty.textContent = 'No paid orders yet.';
    empty.style.display = 'block';
    renderStats([]);
    return;
  }
  empty.style.display = 'none';
  renderStats(data.orders);
  body.innerHTML = data.orders.map(o => `
    <tr>
      <td class="mono">${o.orderId}</td>
      <td>${new Date(o.date).toLocaleDateString('en-IN', { day:'numeric', month:'short', year:'numeric' })}</td>
      <td>${o.name}<br><span style="color:#999;font-size:11px">${o.email}</span></td>
      <td>${o.items}</td>
      <td>₹${o.total}</td>
      <td>
        <select onchange="updateStatus('${o.orderId}', this)">
          ${STAGES.map(s => `<option value="${s}" ${s === o.status ? 'selected' : ''}>${s}</option>`).join('')}
        </select>
        <span class="status-saved" id="saved-${o.orderId}">✓ Saved</span>
      </td>
    </tr>`).join('');
}

// One glance = total order count + revenue + how many are sitting in
// each stage, so the owner never has to count sheet rows by hand.
function renderStats(orders) {
  const totalOrders = orders.length;
  const totalRevenue = orders.reduce((sum, o) => sum + (Number(o.total) || 0), 0);
  const counts = {};
  STAGES.forEach(s => counts[s] = 0);
  orders.forEach(o => { const s = o.status || 'Order Placed'; counts[s] = (counts[s] || 0) + 1; });

  const tiles = [
    { label: 'Total Orders', num: totalOrders },
    { label: 'Total Revenue', num: '₹' + totalRevenue.toLocaleString('en-IN') },
    ...STAGES.map(s => ({ label: s, num: counts[s] || 0 })),
  ];
  document.getElementById('statsRow').innerHTML = tiles.map(t => `
    <div class="stat-tile"><div class="num">${t.num}</div><div class="label">${t.label}</div></div>
  `).join('');
}

async function updateStatus(orderId, selectEl) {
  const status = selectEl.value;
  try {
    const res = await fetch(`${API_BASE}/api/admin/orders/${encodeURIComponent(orderId)}/status`, {
      method: 'POST',
      credentials: 'include',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ status }),
    });
    const data = await res.json();
    if (!res.ok || !data.ok) throw new Error(data.error || 'Could not update status.');
    const saved = document.getElementById(`saved-${orderId}`);
    saved.style.display = 'inline';
    setTimeout(() => saved.style.display = 'none', 2500);
  } catch (e) {
    alert('⚠️ ' + e.message);
  }
}

document.addEventListener('DOMContentLoaded', checkAdminSession);
</script>
</body>
</html>
